name: CI

on:
  pull_request:
    paths-ignore:
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.html"
      - "**.csv"
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
env:
    # Fork Miyano: tên nhánh của repo này (develop, version-15, feat/*) KHÔNG dùng để chọn
    # nhánh upstream nữa. install.sh truyền biến này thẳng vào `git clone frappe --branch`,
    # nên khi PR nhắm vào `develop` thì CI clone nhầm frappe develop (v16, cú pháp PEP 695
    # `type X = ...` → SyntaxError trên Python 3.10). App này là HRMS v15 (pyproject ghim
    # frappe/erpnext >=15.0.0,<16.0.0), vì vậy ghim cứng nhánh upstream ở version-15.
    HR_BRANCH: version-15
    # erpnext phải là bản CỦA MIYANO, không phải của frappe: bench thật chạy mvl26/erpnext, nên nếu
    # CI cài frappe/erpnext thì nó đang kiểm một tổ hợp không ai deploy — sinh lỗi giả (ví dụ erpnext
    # của frappe thêm AssetMovement.validate_transaction_date mà bản Miyano chưa có). Dùng nhánh
    # version-15 chứ không phải nhánh feature đang chạy, để CI không phụ thuộc mục tiêu di động.
    ERPNEXT_REPO: https://github.com/mvl26/erpnext
    ERPNEXT_BRANCH: version-15
    # frappe cung phai khop production: bench chay 15.112.0, con nhanh version-15 tren GitHub nay
    # da la 15.116.1 va them chan `distinct(...)` trong db_query -> erpnext 15.83.0 cua Miyano vo
    # o Repost Allowed Types. Ghim dung ban dang deploy. NHO NANG khi nang frappe tren bench.
    FRAPPE_REPO: https://github.com/frappe/frappe
    FRAPPE_BRANCH: v15.112.0

concurrency:
  # Truoc day ghim cung "develop" nen PR nham nhanh khac van dung chung mot nhom huy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: "production"

    strategy:
      fail-fast: false

      matrix:
        container: [1, 2]

    name: Python Unit Tests

    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          # 3.12 nằm trong khoảng cho phép của frappe v15 (>=3.10,<3.15), erpnext v15 và hrms (>=3.10).
          # Đánh đổi: bước compileall bên dưới không còn canh mốc 3.10 nữa, nên cú pháp chỉ chạy
          # được từ 3.11+ có thể lọt vào dù pyproject vẫn khai requires-python ">=3.10".
          python-version: '3.12'

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: 18
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BRANCH_TO_CLONE: ${{ env.HR_BRANCH }}
          ERPNEXT_REPO: ${{ env.ERPNEXT_REPO }}
          ERPNEXT_BRANCH: ${{ env.ERPNEXT_BRANCH }}
          FRAPPE_REPO: ${{ env.FRAPPE_REPO }}
          FRAPPE_BRANCH: ${{ env.FRAPPE_BRANCH }}

      - name: Run Tests
        run: cd ~/frappe-bench/ && bench --site test_site run-parallel-tests --app hrms --total-builds 2 --build-number ${{ matrix.container }}
        env:
          TYPE: server
